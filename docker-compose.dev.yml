# Dev overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The api container uses the maven image directly so you can
# edit source on the host and restart the container to pick up
# changes without rebuilding the image.
#
# This file also adds a one-shot `fams-seed` service: it waits for fams-api
# to report healthy (and therefore finish Flyway), then runs the deterministic
# scripts/seed.sh dataset directly against PostgreSQL. This means any
# dev who clones the repo and runs `make dev-d` (or plain `docker compose
# -f docker-compose.yml -f docker-compose.dev.yml up`) ends up with the same
# Vietnamese demo dataset automatically — no separate manual step needed.
# It is intentionally only wired into this dev override, never into
# docker-compose.yml/docker-compose.full.yml, so production-style runs are
# never auto-seeded.

services:

  fams-api:
    build:
      context: ./api-server
      dockerfile: Dockerfile.dev
    image: fams-api-dev
    container_name: fams-api
    working_dir: /workspace
    volumes:
      - ./api-server:/workspace          # host source → container
      - maven_cache:/root/.m2            # persist downloaded deps
      # Found via IDE-side investigation (2026-08-07): the maven:3.9-eclipse-temurin-21 base
      # image runs as root by default, and with no `user:` override here, every file `mvn`
      # writes under /workspace/target ends up root-owned ON THE HOST TOO (bind-mount, not a
      # Docker-managed volume) — the host user can't write there anymore. That silently breaks
      # any LOCAL (non-Docker) Maven/IDE build (VSCode's Java Language Server needs to write/read
      # target/generated-sources for Lombok-processed types), which cascades into hundreds of
      # false "cannot find symbol" errors for Lombok-generated getters/setters/builders across
      # nearly every file — NOT a real code problem, confirmed by dozens of clean Docker builds.
      # Fix: give the container's target/ its own named volume instead of bind-mounting it —
      # the container still writes there as root, but that root-owned data now lives inside
      # Docker's own storage, invisible to the host filesystem. The host's own `target/` (from a
      # local `mvn compile` or the IDE) stays entirely separate and host-owned. No UID-matching
      # needed, safe regardless of which host UID any given dev machine uses.
      - api_target:/workspace/target
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms256m -Xmx512m"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      # NOTE: deliberately NOT /actuator/health — that endpoint's aggregate
      # status goes DOWN (HTTP 503) whenever FCM_SERVICE_ACCOUNT_JSON isn't a
      # real Firebase credential (fine for Java-only/no-push-notification
      # dev work), which would make this healthcheck (and therefore fams-seed)
      # hang forever in that common case. /api/v1/auth/health is a plain
      # "is the app up" check with no such dependency.
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # Issue #4 (docs/issues/ISSUES.md): S3-compatible object storage for avatar uploads.
  # Dev-only stand-in for real AWS S3 — same AvatarStorageService code talks to either,
  # switching on whether S3_ENDPOINT is set (see application.yml's app.s3.* block).
  minio:
    image: minio/minio:latest
    container_name: fams-minio
    # Found live (2026-08-12): this had no restart policy (defaults to "no") — when the
    # container exited once, it stayed down permanently with no operator signal, and every
    # subsequent fams-api boot then crashed the whole ApplicationContext trying to reach it
    # (see AvatarStorageService — now fixed to degrade gracefully instead of crashing, but
    # MinIO itself should still come back on its own rather than needing a manual restart).
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fams_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fams_minio_secret}
    ports:
      - "${MINIO_EXPOSE_PORT:-9000}:9000"     # S3 API — avatar URLs point here
      - "${MINIO_CONSOLE_EXPOSE_PORT:-9001}:9001"  # web console, optional
    volumes:
      - minio_data:/data
    networks:
      - fams-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  fams-seed:
    build:
      context: ./docker/seed
    container_name: fams-seed
    depends_on:
      fams-api:
        condition: service_healthy
    networks:
      - fams-net
    environment:
      BASE_URL: http://fams-api:8080
      DB_HOST: fams-postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

volumes:
  maven_cache:
  minio_data:
  api_target:
