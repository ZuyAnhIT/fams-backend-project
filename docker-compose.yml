services:
  fams-postgres:
    image: postgis/postgis:16-3.4
    container_name: fams-postgres
    environment:
      POSTGRES_DB: fams_db
      POSTGRES_USER: fams_user
      POSTGRES_PASSWORD: anhanh0505
    ports:
      - "5433:5432"
    volumes:
      - fams_postgres_data:/var/lib/postgresql/data

  fams-redis:
    image: redis:7
    container_name: fams-redis
    ports:
      - "6379:6379"

volumes:
  fams_postgres_data: