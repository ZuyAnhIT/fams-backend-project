spring:
  application:
    name: fams-api-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:fams_db}
    username: ${DB_USER:fams_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# JWT config — consumed by shared/security/JwtProvider
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Frontend origin (web/mobile deep-link) for the two emailed links a human clicks
  # straight into a UI screen: password reset and email verification. Deliberately
  # separate from app.base-url — that one is the API server's own origin, used where a
  # link is meant to hit this backend directly (for example the TOTP QR page) or
  # by other services that build URLs against this server. Web frontend serves
  # /reset-password and /verify-email routes at this origin, including email-change
  # confirmation via /verify-email?mode=email-change; the native app registers
  # the same paths as Android App Links / iOS Universal Links (falls back to its custom
  # scheme when this isn't a real HTTPS domain yet — see fams-front-app-project docs
  # 07/08). See PasswordResetService, RegisterService, EmailVerificationService.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  sms:
    # true  = log OTP ra console (dev/test, không gửi SMS thật)
    # false = dùng SMS provider thật (production)
    dev-mode: true
  otp:
    # Backlog #2 (Đăng nhập bằng số điện thoại OTP): per-IP request limit on
    # /auth/otp/verify — Firebase itself gates the actual OTP code, this just
    # throttles abuse of the verify endpoint (see FirebasePhoneLoginService).
    rate-limit-max: ${OTP_RATE_LIMIT_MAX:10}
  email:
    verification-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
    resend-rate-limit-max: ${EMAIL_RESEND_RATE_LIMIT_MAX:3}
  totp:
    encryption-key: ${TOTP_ENCRYPTION_KEY}
  s3:
    # Issue #4 (docs/issues/ISSUES.md): avatar uploads via S3-compatible object storage.
    # Dev/self-hosted: point at the MinIO container (docker-compose.dev.yml) by setting
    # S3_ENDPOINT. Production: leave S3_ENDPOINT empty to talk to real AWS S3 with IAM
    # credentials — same code path either way (see AvatarStorageService).
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:fams-avatars}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # Deliberately separate from app.base-url: base-url points at the WEB FRONTEND origin
    # (so emailed links are clickable there and Next.js proxies /api/** through to this
    # backend — see fams-front-web-project/next.config.ts). That proxy doesn't cover
    # object-storage URLs, so this must be the bucket's own public URL/CDN domain.
    public-url: ${S3_PUBLIC_URL:http://localhost:9000/fams-avatars}
  password-reset:
    rate-limit-max: ${PASSWORD_RESET_RATE_LIMIT_MAX:3}
  invitation:
    expiry-days: ${INVITATION_EXPIRY_DAYS:7}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  fcm:
    project-id: ${FCM_PROJECT_ID:}
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
  ai:
    service:
      internal-url: ${AI_SERVICE_INTERNAL_URL:http://fams-ai:5000}
    internal-secret: ${AI_INTERNAL_SECRET}
    enroll-min-photos: ${AI_ENROLL_MIN_PHOTOS:3}
    enroll-max-photos: ${AI_ENROLL_MAX_PHOTOS:5}
  data-retention:
    delivery-log-days: ${DATA_RETENTION_DELIVERY_LOG_DAYS:30}
    notification-days: ${DATA_RETENTION_NOTIFICATION_DAYS:90}
  cors:
    # Only needed for browser clients that call this API cross-origin (Expo web dev
    # server, and LAN-IP origins when testing the Expo web build from another device
    # on the same network). Native iOS/Android and the Web Admin (which proxies /api/**
    # same-origin via next.config.ts rewrites) are unaffected by CORS entirely.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  default-produces-media-type: application/json

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
