spring:
  application:
    name: fams-api-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:fams_db}
    username: ${DB_USER:fams_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# JWT config — consumed by shared/security/JwtProvider
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  otp:
    dev-fixed-code: ${OTP_DEV_FIXED_CODE:}
    rate-limit-max: ${OTP_RATE_LIMIT_MAX:3}
  email:
    verification-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
  password-reset:
    rate-limit-max: ${PASSWORD_RESET_RATE_LIMIT_MAX:3}
  invitation:
    expiry-days: ${INVITATION_EXPIRY_DAYS:7}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  ai:
    service:
      internal-url: ${AI_SERVICE_INTERNAL_URL:http://fams-ai:5000}
    internal-secret: ${AI_INTERNAL_SECRET}
    enroll-min-photos: ${AI_ENROLL_MIN_PHOTOS:3}
    enroll-max-photos: ${AI_ENROLL_MAX_PHOTOS:5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  default-produces-media-type: application/json

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
